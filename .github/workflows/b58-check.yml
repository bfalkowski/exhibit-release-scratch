# A real run for Exhibit ticket 193: the Building58 setup note's policy, on a GitHub runner.
# It runs exhibit check on Building58 PR 147 with examples/building58/evidence.yml, the way the
# setup note's check job would, and prints how long it took.
name: Building58 policy run
on:
  push:
    branches: [b58-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: exhibit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bfalkowski/Building58
          path: b58
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: exhibit
      - name: exhibit check on Building58 PR 147
        working-directory: b58
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp ../exhibit/examples/building58/evidence.yml .
          node --version
          start=$(date +%s)
          node ../exhibit/bin/exhibit.js check --pr 147 --repo bfalkowski/Building58 --shadow
          echo "exhibit check took $(( ($(date +%s) - start) / 60 )) minutes"
          cat .exhibit/summary.md
          node -e "const e=require('./.exhibit/evidence.json');for(const r of e.requirements)console.log(r.type,r.status,JSON.stringify(r.details?.head??'').slice(0,300))"
